name: Extract Google Sheets

on:
  workflow_dispatch:

  push:
    branches:
      - dev
    paths:
      - "scripts/00_extract_google_sheets.py"
      - "config/sources.yaml"
      - "requirements.txt"
      - ".github/workflows/extract_google_sheets.yml"

jobs:

  extract:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Esta etapa será utilizada quando criarmos o Secret
      - name: Criar credentials.json
        run: |
          cat <<EOF > credentials.json
          ${{ secrets.GOOGLE_CREDENTIALS }}
          EOF

      - name: Executar extração
        run: |
          python scripts/00_extract_google_sheets.py

      - name: Mostrar arquivos gerados
        run: |
          echo "Conteúdo da pasta raw:"
          ls -lah raw

      - name: Publicar arquivos da camada Raw
        uses: actions/upload-artifact@v4
        with:
          name: raw-data
          path: raw/
