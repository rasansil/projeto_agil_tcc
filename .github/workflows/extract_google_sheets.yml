name: Extract Google Sheets

on:
  workflow_dispatch:

  push:
    branches:
      - dev
    paths:
      - "scripts/**"
      - "utils/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/extract_google_sheets.yml"

jobs:

  pipeline:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Criar credentials.json
        run: |
          cat <<EOF > credentials.json
          ${{ secrets.GOOGLE_CREDENTIALS }}
          EOF

      ##################################################
      # Camada Raw
      ##################################################

      - name: Extrair dados do Google Sheets
        run: |
          python scripts/00_extract_google_sheets.py

      ##################################################
      # Camada Bronze
      ##################################################

      - name: Raw -> Bronze
        run: |
          python scripts/01_raw_to_bronze.py

      ##################################################
      # Camada Silver
      ##################################################

      - name: Bronze -> Silver
        run: |
          python scripts/02_bronze_to_silver.py

      ##################################################
      # Mostrar arquivos gerados
      ##################################################

      - name: Listar arquivos gerados
        run: |
          echo "========== RAW =========="
          ls -lah raw || true

          echo ""
          echo "======== BRONZE ========="
          ls -lah bronze || true

          echo ""
          echo "======== SILVER ========="
          ls -lah silver || true

          echo ""
          echo "======== DATABASE ======="
          ls -lah database || true

      ##################################################
      # Publicar Artefatos
      ##################################################

      - name: Publicar camada Raw
        uses: actions/upload-artifact@v4
        with:
          name: raw-data
          path: raw/

      - name: Publicar camada Bronze
        uses: actions/upload-artifact@v4
        with:
          name: bronze-data
          path: bronze/

      - name: Publicar camada Silver
        uses: actions/upload-artifact@v4
        with:
          name: silver-data
          path: silver/
