name: Pipeline Medalhão

on:
  workflow_dispatch:

  push:
    branches:
      - dev

jobs:

  # ==========================================================
  # JOB 1 - EXTRAÇÃO (RAW)
  # ==========================================================
  raw:

    name: 01 - Google Sheets -> Raw

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Criar credentials.json
        run: |
          cat <<EOF > credentials.json
          ${{ secrets.GOOGLE_CREDENTIALS }}
          EOF

      - name: Extrair dados do Google Sheets
        run: |
          python scripts/00_extract_google_sheets.py

      - name: Verificar camada Raw
        run: |
          echo "===== RAW ====="
          ls -lah raw

      - name: Publicar Raw
        uses: actions/upload-artifact@v4
        with:
          name: raw-data
          path: raw/


  # ==========================================================
  # JOB 2 - BRONZE
  # ==========================================================
  bronze:

    name: 02 - Raw -> Bronze

    needs: raw

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Baixar Raw
        uses: actions/download-artifact@v4
        with:
          name: raw-data
          path: raw

      - name: Executar Bronze
        run: |
          python scripts/01_raw_to_bronze.py

      - name: Verificar Bronze
        run: |
          echo "===== BRONZE ====="
          ls -lah bronze

      - name: Publicar Bronze
        uses: actions/upload-artifact@v4
        with:
          name: bronze-data
          path: |
            bronze/
            database/dev_duckdb.duckdb


  # ==========================================================
  # JOB 3 - SILVER
  # ==========================================================
  silver:

    name: 03 - Bronze -> Silver

    needs: bronze

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Baixar Bronze
        uses: actions/download-artifact@v4
        with:
          name: bronze-data
          path: .

      - name: Executar Silver
        run: |
          python scripts/02_bronze_to_silver.py

      - name: Verificar Silver
        run: |
          echo "===== SILVER ====="
          ls -lah silver

      - name: Publicar Silver
        uses: actions/upload-artifact@v4
        with:
          name: silver-data
          path: |
            silver/
            database/dev_duckdb.duckdb
